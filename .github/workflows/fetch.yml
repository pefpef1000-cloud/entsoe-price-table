name: Refresh prices

on:
  schedule:
    # Every 4 hours. Day-ahead prices really only change once a day
    # (published early afternoon CET), but running a bit more often
    # costs nothing and means a missed publish gets picked up sooner.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed databases back to the repo

# Never two runs at once (a manual run and a scheduled one would each try to
# commit the databases). A run that is already going finishes; the next waits.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's snapshot (all zones - price_table.py)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_recent.py

      # The 4 steps below feed pages/Year_comparison.py. Each one is
      # allowed to fail without blocking the others or the commit at the
      # end - a temporary hiccup on one feed (e.g. JAO's API being briefly
      # down) shouldn't stop the other 2 from refreshing, or stop the
      # already-fetched snapshot above from being committed. A failed
      # step still shows up as a warning in the Actions log.
      - name: Fetch full history for DE_LU / FR / GB (year_comparison.py)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_recent_years.py
        continue-on-error: true

      - name: Bridge GB's provisional price from Nord Pool N2EX (recent days + tomorrow)
        run: python fetch_gb_bridge.py
        continue-on-error: true

      # GB's price series proper: Elexon's APX index for every complete day
      # from 2021 (one consistent source, so years are like-for-like). Runs
      # AFTER the Nord Pool step because it replaces that step's provisional
      # N2EX rows once a day is complete. It also converts ENTSO-E's 2020 GB
      # rows from pounds to euros, once (see fetch_gb_apx.py).
      - name: GB price from Elexon APX (2020 pounds fix once, then 2021 to yesterday)
        run: python fetch_gb_apx.py
        continue-on-error: true

      - name: Fetch JAO corridor auction prices (interconnectors)
        env:
          JAO_API_KEY: ${{ secrets.JAO_API_KEY }}
        run: python fetch_jao_corridors.py
        continue-on-error: true

      - name: Commit updated databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entsoe_data.db jao_data.db
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Refresh prices"
          # If someone pushed code while this run was going, a plain "git push"
          # is refused and the whole run's data is thrown away (run #82 on
          # 2026-09-29 was lost that way) - so catch up first.
          git pull --rebase
          git push || { git pull --rebase && git push; }
